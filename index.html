<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="description" content="WordPair — мікро-тренування словникових пар замість тікток-пауз" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>WordPair</title>
    <style>
      /* критичний inline-стиль: екран не блимає білим до завантаження JS
         і документ не прокручується вже з першого кадру (iOS) */
      html { height: 100%; overflow: hidden; }
      body {
        position: fixed; inset: 0; margin: 0; overflow: hidden;
        overscroll-behavior: none; touch-action: manipulation;
        background: #0b0d17; color: #f2f4ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
