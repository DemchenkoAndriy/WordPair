name: CI

on:
  push:
    # На гілках, які публікуються, перевірку вже робить deploy.yml —
    # не ганяємо ті самі тести двічі.
    branches-ignore:
      - main
      - master
      - claude/word-learning-app-architecture-vwti3x
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Типи, тести, збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
