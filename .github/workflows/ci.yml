name: CI

on:
  push:
    branches-ignore: [main, master] # на main перевірку вже робить деплой
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Типи, тести, збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
